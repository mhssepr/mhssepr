<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Audit Trail — Meserete Hiwot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090c;--surface:#111318;--surface2:#171a21;--border:#292e38;--gold:#c9a45c;--text:#f5f3ee;--muted:#9299a7;--ok:#36c98f;--warn:#e7b84b;--bad:#e45d68}html[data-theme=light]{--bg:#f7f8fa;--surface:#fff;--surface2:#f1f3f5;--border:#e2e6ec;--gold:#b8922e;--text:#172033;--muted:#596579}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,'Noto Sans Ethiopic',sans-serif}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:13px;overflow:hidden;background:linear-gradient(145deg,#e5cc91,#b8922e)}.logo img{width:100%;height:100%;object-fit:contain}.eyebrow{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.12em;text-transform:uppercase}.title{font-size:27px;margin:3px 0}.actions{display:flex;gap:8px}.btn{padding:10px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;cursor:pointer}.btn.primary{background:var(--gold);color:#111;border-color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px}.stat b{font-size:24px;display:block;margin-top:6px}.stat span{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px;margin-bottom:12px}.toolbar input,.toolbar select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 11px;border-radius:10px;min-width:150px}.toolbar input[type=search]{flex:1;min-width:220px}.table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px}.table{width:100%;border-collapse:collapse;min-width:920px}.table th,.table td{padding:13px 14px;border-bottom:1px solid var(--border);text-align:left;font-size:12px;vertical-align:top}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.action{font-weight:800}.INSERT{color:var(--ok)}.UPDATE{color:var(--warn)}.DELETE{color:var(--bad)}.details{background:var(--surface2);padding:14px;border-bottom:1px solid var(--border);display:none}.details.open{display:block}.json{white-space:pre-wrap;word-break:break-word;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:300px;overflow:auto}.linkbtn{border:0;background:none;color:var(--gold);cursor:pointer;font-weight:800}.pager{display:flex;justify-content:space-between;align-items:center;padding:14px;color:var(--muted);font-size:12px}.empty{text-align:center;padding:45px;color:var(--muted)}.owner-note{color:var(--muted);font-size:12px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}@media(max-width:800px){.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.toolbar input,.toolbar select{flex:1;min-width:130px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo"><img src="logo.png" alt="Meserete Hiwot"></div><div><div class="eyebrow">Owner Console</div><h1 class="title">Audit Trail</h1><div class="owner-note">Every recorded change shows who performed it, what changed, and when.</div></div></div><div class="actions"><button class="btn" id="theme">🌙 Theme</button><button class="btn" onclick="location.href='dashboard.html'">← Dashboard</button><button class="btn primary" id="export">Export CSV</button></div></div>
<div class="stats"><div class="stat"><span>Total events</span><b id="total">—</b></div><div class="stat"><span>Last 24 hours</span><b id="day">—</b></div><div class="stat"><span>Updates</span><b id="updates">—</b></div><div class="stat"><span>Deletes</span><b id="deletes">—</b></div></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search user, table, record or action…"><select id="action"><option value="">All actions</option><option>INSERT</option><option>UPDATE</option><option>DELETE</option></select><input id="date" type="date"><button class="btn" id="clear">Clear</button></div>
<div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Who</th><th>Action</th><th>Table / Module</th><th>Record</th><th>Changed fields</th><th></th></tr></thead><tbody id="body"><tr><td colspan="7" class="empty">Loading audit trail…</td></tr></tbody></table><div class="pager"><span id="pageInfo">—</span><div><button class="btn" id="prev">Previous</button> <button class="btn" id="next">Next</button></div></div></div><div class="footer">Owner-only MHSS EPR audit trail • <span id="stamp"></span></div></div>
<script type="module">
import {supabase} from './supabaseClient.js';
const OWNER='mhssepr@gmail.com', $=id=>document.getElementById(id); let rows=[], page=0, pageSize=50;
function applyTheme(){const d=document.documentElement;const next=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=next;localStorage.setItem('mh_theme_pref',next)}$('theme').onclick=applyTheme;if(localStorage.getItem('mh_theme_pref')==='dark')document.documentElement.dataset.theme='dark';
async function gate(){const {data}=await supabase.auth.getSession();const email=(data?.session?.user?.email||'').toLowerCase();if(!data?.session||email!==OWNER){location.replace('dashboard.html');return false}return true}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function filtered(){const q=$('search').value.trim().toLowerCase(), a=$('action').value, d=$('date').value;return rows.filter(r=>(!q||[r.actor_email,r.table_name,r.record_id,r.action].some(x=>String(x||'').toLowerCase().includes(q)))&&(!a||r.action===a)&&(!d||String(r.occurred_at).slice(0,10)===d))}
function render(){const data=filtered(), start=page*pageSize, chunk=data.slice(start,start+pageSize);$('body').innerHTML=chunk.length?chunk.map((r,i)=>`<tr><td>${esc(new Date(r.occurred_at).toLocaleString())}</td><td><b>${esc(r.actor_email||'Unknown')}</b><br><small>${esc(r.actor_user_id||'')}</small></td><td class="action ${esc(r.action)}">${esc(r.action)}</td><td>${esc(r.table_name)}</td><td>${esc(r.record_id||'—')}</td><td>${esc(r.changed_fields?Object.keys(r.changed_fields).join(', '):'—')}</td><td><button class="linkbtn" data-open="${start+i}">View</button></td></tr><tr class="details" id="detail-${start+i}"><td colspan="7"><b>Changed fields</b><div class="json">${esc(JSON.stringify(r.changed_fields||{},null,2))}</div><b>Before</b><div class="json">${esc(JSON.stringify(r.old_data||{},null,2))}</div><b>After</b><div class="json">${esc(JSON.stringify(r.new_data||{},null,2))}</div></td></tr>`).join(''):`<tr><td colspan="7" class="empty">No audit events match your filters.</td></tr>`;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>$(`detail-${b.dataset.open}`).classList.toggle('open'));$('pageInfo').textContent=data.length?`Showing ${start+1}–${Math.min(start+pageSize,data.length)} of ${data.length}`:'0 events';$('prev').disabled=page===0;$('next').disabled=(start+pageSize>=data.length)}
async function load(){if(!(await gate()))return;const {data,error}=await supabase.from('mhss_audit_logs').select('*').order('occurred_at',{ascending:false}).limit(5000);if(error){$('body').innerHTML=`<tr><td colspan="7" class="empty">Could not load audit trail. Run audit_trail.sql first.</td></tr>`;console.error(error);return}rows=data||[];const day=Date.now()-86400000;$('total').textContent=rows.length.toLocaleString();$('day').textContent=rows.filter(r=>new Date(r.occurred_at).getTime()>=day).length.toLocaleString();$('updates').textContent=rows.filter(r=>r.action==='UPDATE').length.toLocaleString();$('deletes').textContent=rows.filter(r=>r.action==='DELETE').length.toLocaleString();render();$('stamp').textContent=new Date().toLocaleString()}
['search','action','date'].forEach(id=>$(id).addEventListener('input',()=>{page=0;render()}));$('clear').onclick=()=>{$('search').value='';$('action').value='';$('date').value='';page=0;render()};$('prev').onclick=()=>{if(page>0){page--;render()}};$('next').onclick=()=>{if((page+1)*pageSize<filtered().length){page++;render()}};
$('export').onclick=()=>{const data=filtered();const cols=['occurred_at','actor_email','actor_user_id','action','table_name','record_id','changed_fields'];const csv=[cols.join(','),...data.map(r=>cols.map(c=>`"${String(c==='changed_fields'?JSON.stringify(r[c]||{}):r[c]??'').replace(/"/g,'""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mhss-audit-trail.csv';a.click();URL.revokeObjectURL(a.href)};
load();
</script></body></html>
