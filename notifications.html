<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MHSS EPR — Notifications</title>
<style>
:root{--bg:#08090C;--surface:#111318;--surface2:#171A21;--border:#262A33;--gold:#C9A45C;--gold2:#E5CC91;--text:#F5F3EE;--muted:#8C919C;--success:#36C98F;--danger:#E45D68;--warning:#E7B84B}
html[data-theme=light]{--bg:#F7F8FA;--surface:#FFF;--surface2:#F1F3F5;--border:#E2E6EC;--gold:#B8922E;--gold2:#D4AF37;--text:#172033;--muted:#596579;--success:#187A54;--danger:#B33440;--warning:#8A5D07}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}body{overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:14px clamp(14px,3vw,28px)}.topin{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;object-fit:contain;border-radius:10px}.brand h1{font-size:15px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}.actions{display:flex;gap:8px}.btn{min-height:40px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:8px 13px;font-weight:700}.btn.primary{background:var(--gold);border-color:var(--gold);color:#17120a}.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
main{max-width:1200px;margin:auto;padding:22px clamp(14px,3vw,30px) 45px}.hero{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}.hero h2{font-size:25px;margin:0}.hero p{margin:5px 0 0;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.panel-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-head h3{margin:0;font-size:14px}
.panel-body{padding:16px}
.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 11px;min-height:42px;outline:none}
.field textarea{min-height:110px;resize:vertical}
.notice{padding:10px 12px;border-radius:10px;margin-bottom:12px;background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);font-size:12px}
.notice.success{background:color-mix(in srgb,var(--success) 10%,transparent);color:var(--success)}
.thread-list{max-height:640px;overflow-y:auto}
.thread-row{display:flex;align-items:flex-start;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.thread-row:last-child{border-bottom:0}
.thread-row:hover{background:var(--surface2)}
.thread-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:6px;flex-shrink:0}
.thread-row-main{flex:1;min-width:0}
.thread-row-top{display:flex;align-items:center;gap:8px}
.thread-subject{font-weight:800;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread-time{font-size:11px;color:var(--muted);flex-shrink:0}
.thread-snippet{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;border:1px solid var(--border);white-space:nowrap;margin-top:4px}
.badge.broadcast{color:var(--gold2);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.badge.reply{color:var(--gold2);background:color-mix(in srgb,var(--gold) 8%,transparent)}
.empty{padding:45px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:14px}
.overlay.hidden{display:none}
.modal{width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 25px 80px rgba(0,0,0,.35)}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-head h3{margin:0;font-size:15px}
.modal-thread{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:82%;padding:.6rem .8rem;border-radius:12px;font-size:13px;line-height:1.45}
.bubble-self{align-self:flex-end;background:var(--gold);color:#17120a}
.bubble-other{align-self:flex-start;background:var(--surface2);color:var(--text)}
.bubble-meta{display:block;font-size:10px;opacity:.75;margin-top:4px}
.modal-reply{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--border)}
.modal-reply textarea{flex:1;min-height:44px;max-height:120px;resize:none}
.hidden{display:none!important}
.toast{position:fixed;right:16px;bottom:16px;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 14px;box-shadow:0 15px 40px rgba(0,0,0,.25);font-size:12px}

/* ===================== Shared App Header (matches attendance.html) ===================== */
.app-header{position:sticky;top:0;z-index:30;width:100%;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;background:var(--surface) !important;border-bottom:1px solid var(--border) !important;box-shadow:0 8px 28px rgba(23,32,51,.05);backdrop-filter:blur(18px);}
html[data-theme="dark"] .app-header{box-shadow:0 18px 42px rgba(0,0,0,.20);}
@media(min-width:769px){.app-header{flex-wrap:nowrap !important;gap:24px !important;padding:22px 32px !important;}}
.app-header .header-brand{display:flex;align-items:center;gap:14px;min-width:0;}
.app-header .header-brand img{width:52px;height:52px;border-radius:16px;background:var(--surface2);padding:6px;border:1px solid var(--border);box-shadow:0 8px 20px -8px rgba(184,146,46,.25);flex-shrink:0;object-fit:contain;}
.app-header .header-brand h1{font-size:1.3rem;font-weight:800;margin:0;letter-spacing:-.01em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.app-header .header-brand p{color:var(--gold);font-weight:600;margin:3px 0 0;font-size:.78rem;}
.header-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.header-date-block{text-align:right;margin-right:2px;}
.header-date-block .header-date{font-size:.8rem;color:var(--muted);margin:0;}
.header-date-block .header-admin{font-size:1rem;font-weight:600;margin:0;color:var(--text);}
@media(max-width:1024px){.header-date-block{display:none;}}
.lang-switch{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
.lang-switch button{border:none;background:transparent;font-size:12px;font-weight:700;letter-spacing:.03em;padding:6px 12px;border-radius:999px;color:var(--muted);cursor:pointer;transition:all .25s ease;}
.lang-switch button.active{background:var(--gold);color:#fff;box-shadow:0 4px 12px -3px rgba(184,146,46,.4);}
.theme-toggle{position:relative;width:52px;height:30px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;padding:0;flex-shrink:0;}
.theme-toggle .knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--gold2);display:flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 6px rgba(0,0,0,.20);}
html[data-theme="light"] .theme-toggle .knob{transform:translateX(22px);}
.theme-toggle .knob svg{width:14px;height:14px;}
.back-dash-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--text);transition:all .2s ease;text-decoration:none;}
.back-dash-btn:hover{background:var(--border);transform:translateY(-2px);border-color:var(--gold);color:var(--gold);}
@media(max-width:768px){
  .app-header{padding:1rem !important;align-items:center !important;}
  .header-controls{width:100%;justify-content:space-between;gap:7px;}
}
@media(max-width:480px){
  .app-header{padding:14px 16px !important;}
  .app-header .header-brand h1{font-size:1.05rem !important;}
  .app-header .header-brand p{font-size:.68rem !important;}
  .app-header .header-brand img{width:44px !important;height:44px !important;}
  .header-controls{gap:7px;}
  .lang-switch button{padding:6px 9px;}
  .back-dash-btn{padding:9px !important;}
  .back-dash-btn span.label{display:none;}
}

/* ===== Real Messaging Center Upgrade ===== */
.rich-compose{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface2)}
.rich-toolbar{display:flex;align-items:center;gap:4px;padding:7px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface)}
.rich-toolbar::-webkit-scrollbar{height:4px}
.rich-tool{width:34px;height:32px;flex:0 0 auto;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);font-weight:800;display:grid;place-items:center}
.rich-tool:hover,.rich-tool.active{background:var(--surface2);border-color:var(--border);color:var(--gold)}
.rich-editor{min-height:170px;max-height:340px;overflow:auto;padding:13px 14px;outline:none;line-height:1.6;background:var(--surface2);color:var(--text)}
.rich-editor:empty:before{content:attr(data-placeholder);color:var(--muted)}
.rich-editor blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent);border-radius:6px}
.rich-editor img{max-width:100%;height:auto;border-radius:10px}
.compose-files{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px;border-top:1px solid var(--border)}
.file-chip{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.file-chip .file-remove{border:0;background:transparent;color:var(--danger);font-weight:900}
.message-card{max-width:88%;padding:12px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--border);box-shadow:0 8px 22px rgba(0,0,0,.05)}
.bubble-self .message-card{background:color-mix(in srgb,var(--gold) 17%,var(--surface));border-color:color-mix(in srgb,var(--gold) 45%,var(--border))}
.msg-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.msg-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#17120a;font-weight:900;overflow:hidden}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg-name{font-weight:900;font-size:12px}.msg-role,.msg-time{font-size:10px;color:var(--muted)}
.msg-content{font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.msg-content blockquote{margin:9px 0;padding:8px 12px;border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 9%,transparent);border-radius:6px}
.msg-content img{display:block;max-width:min(420px,100%);max-height:360px;object-fit:contain;border-radius:12px;margin-top:8px;cursor:zoom-in}
.attach-card{display:flex;align-items:center;gap:10px;margin-top:9px;padding:9px;border:1px solid var(--border);border-radius:11px;background:color-mix(in srgb,var(--surface) 80%,transparent)}
.attach-icon{font-size:22px}.attach-info{min-width:0;flex:1}.attach-name{font-weight:800;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.attach-meta{font-size:10px;color:var(--muted)}
.attach-actions{display:flex;gap:5px}.attach-actions a{font-size:10px;font-weight:800;color:var(--gold);text-decoration:none}
.compose-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.compose-actions{display:flex;gap:7px;flex-wrap:wrap}
.attachment-input{display:none}
.preview-overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:18px}
.preview-overlay.hidden{display:none}
.preview-overlay img{max-width:95vw;max-height:88vh;border-radius:14px}
.preview-close{position:absolute;right:18px;top:18px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:20px}

/* ===== Message detail popup ===== */
.detail-subject{font-size:17px;font-weight:900;margin:0}.detail-meta{font-size:11px;color:var(--muted);margin-top:3px}.modal-thread{background:var(--bg)}.modal-thread .message-card{max-width:100%;width:min(560px,100%);margin:0 auto}.modal-thread .bubble{max-width:100%;padding:0;background:transparent;color:var(--text);align-self:stretch}.modal-thread .bubble-self,.modal-thread .bubble-other{align-self:stretch}.modal-thread .msg-content,.modal-thread .media-caption{white-space:pre-wrap;overflow-wrap:anywhere}.modal-thread .message-image{display:block;width:100%;max-height:420px;object-fit:contain;background:#111;cursor:zoom-in}.modal-thread .media-stack{display:flex;flex-direction:column;gap:3px;background:#111}.modal-thread .document-list{padding-top:8px}.modal-reply.hidden-reply{display:none!important}
.receipt-bar{margin:0 18px 10px;padding:10px 12px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);font-size:11px;color:var(--muted)}
.receipt-bar strong{color:var(--text)}
.receipt-list{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.receipt-pill{padding:4px 7px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:10px}
@media(max-width:700px){
  .message-card{max-width:94%}.rich-editor{min-height:145px}.compose-footer{align-items:stretch;flex-direction:column}.compose-actions{justify-content:space-between}
}


.thread-participant{display:flex;align-items:center;gap:8px;margin-bottom:4px}.mini-avatar{width:28px;height:28px;border-radius:50%;background:var(--gold);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;font-weight:900;font-size:11px;color:#17120a}.mini-avatar img{width:100%;height:100%;object-fit:cover}.participant-name{font-size:12px;font-weight:800}.participant-sub{font-size:10px;color:var(--muted)}
.media-stack.bottom{margin-top:10px}.media-caption.top{margin-bottom:0}.message-card .msg-head{position:relative}.chat-participants{display:flex;align-items:center;gap:6px;margin-top:3px}.chat-participants .mini-avatar{width:24px;height:24px}.chat-arrow{color:var(--muted);font-size:11px}
</style>
</head>
<body>
<div id="app" class="app hidden">
<header class="app-header">
<div class="header-brand">
<img src="logo.png" alt="MHSS">
<div><h1>MESERETE HIWOT</h1><p data-i18n="brandSub">Enterprise Management System · Notifications</p></div>
</div>
<div class="header-controls">
<div class="header-date-block"><p class="header-date" id="dateDisplay">Loading date...</p><p class="header-admin">Admin Dashboard</p></div>
<div class="lang-switch" role="group" aria-label="Language switcher">
<button type="button" id="langBtnEn" class="active" aria-pressed="true">ENG</button>
<button type="button" id="langBtnAm" aria-pressed="false">አማ</button>
</div>
<button type="button" class="theme-toggle" id="themeToggleBtn" aria-label="Toggle light/dark theme" aria-pressed="true">
<span class="knob" id="themeKnob"><svg viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg></span>
</button>
<a href="dashboard.html" class="back-dash-btn" id="backBtn" aria-label="Back to Dashboard">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
<span class="label" data-i18n="backToDashboard">Dashboard</span>
</a>
</div>
</header>
<main>
<section class="hero">
  <div>
    <h2 data-i18n="pageTitle">Notifications</h2>
    <p data-i18n="pageDesc">Message a specific user or broadcast to everyone, and keep track of replies.</p>
  </div>
  <div id="unreadSummary" class="badge" aria-live="polite">0 unread</div>
</section>

<div class="grid2">
  <section class="panel">
    <div class="panel-head"><h3 data-i18n="composeTitle">Compose</h3></div>
    <div class="panel-body">
      <div id="composeNotice" class="notice hidden"></div>
      <form id="composeForm">
        <div class="field">
          <label data-i18n="fRecipient">Recipient</label>
          <select id="fRecipient">
            <option value="" data-i18n="fEveryone">Everyone (broadcast)</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="fSubject">Subject</label>
          <input id="fSubject" type="text" maxlength="140" data-i18n-placeholder="fSubjectPlaceholder" placeholder="Subject (optional)">
        </div>
        <div class="field">
          <label data-i18n="fMessage">Message</label>
          <div class="rich-compose">
            <div class="rich-toolbar" id="composeToolbar">
              <button type="button" class="rich-tool" data-cmd="bold" title="Bold"><b>B</b></button>
              <button type="button" class="rich-tool" data-cmd="italic" title="Italic"><i>I</i></button>
              <button type="button" class="rich-tool" data-cmd="underline" title="Underline"><u>U</u></button>
              <button type="button" class="rich-tool" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
              <button type="button" class="rich-tool" data-cmd="formatBlock" data-value="blockquote" title="Quote">❝</button>
              <button type="button" class="rich-tool" data-cmd="justifyLeft" title="Align left">≡</button>
              <button type="button" class="rich-tool" data-cmd="justifyCenter" title="Center">≣</button>
              <button type="button" class="rich-tool" data-cmd="justifyRight" title="Align right">≡</button>
              <button type="button" class="rich-tool" data-cmd="insertUnorderedList" title="Bulleted list">•</button>
              <button type="button" class="rich-tool" data-cmd="insertOrderedList" title="Numbered list">1.</button>
              <button type="button" class="rich-tool" id="linkBtn" title="Link">🔗</button>
              <button type="button" class="rich-tool" id="emojiBtn" title="Emoji">😊</button>
              <button type="button" class="rich-tool" id="attachBtn" title="Attach">📎</button>
              <input id="attachmentInput" class="attachment-input" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt">
              <select id="attachmentPosition" class="btn" style="min-height:32px;padding:5px 9px;font-size:11px" title="Image position"><option value="top">🖼️ Image above message</option><option value="bottom">🖼️ Image below message</option></select>
            </div>
            <div id="fBody" class="rich-editor" contenteditable="true" data-placeholder="Write your message..." aria-label="Message editor"></div>
            <div id="composeFiles" class="compose-files hidden"></div>
          </div>
        </div>
        <div class="compose-footer">
          <div class="compose-actions">
            <button type="button" class="btn" id="previewBtn">Preview</button>
            <button type="button" class="btn" id="draftBtn">Save Draft</button>
          </div>
          <button type="submit" class="btn primary" id="sendBtn" data-i18n="sendBtn">Send</button>
        </div>
      </form>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h3 data-i18n="threadsTitle">All Conversations</h3>
      <button class="btn" id="refreshThreadsBtn" data-i18n="refresh">↻ Refresh</button>
    </div>
    <div id="threadList" class="thread-list">
      <div class="empty" data-i18n="loading">Loading…</div>
    </div>
  </section>
</div>
</main>
</div>

<div class="overlay hidden" id="threadOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalSubject">Thread</h3>
      <button class="btn" id="closeThreadModal">✕</button>
    </div>
    <div class="modal-thread" id="modalThreadBody"></div>
    <div class="modal-reply" style="align-items:flex-end;flex-wrap:wrap">
      <div class="rich-compose" style="flex:1;min-width:220px">
        <div class="rich-toolbar" id="replyToolbar">
          <button type="button" class="rich-tool" data-cmd="bold" title="Bold"><b>B</b></button>
          <button type="button" class="rich-tool" data-cmd="italic" title="Italic"><i>I</i></button>
          <button type="button" class="rich-tool" data-cmd="underline" title="Underline"><u>U</u></button>
          <button type="button" class="rich-tool" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
          <button type="button" class="rich-tool" data-cmd="formatBlock" data-value="blockquote" title="Quote">❝</button>
          <button type="button" class="rich-tool" data-cmd="justifyLeft" title="Align left">≡</button>
          <button type="button" class="rich-tool" data-cmd="justifyCenter" title="Center">≣</button>
          <button type="button" class="rich-tool" data-cmd="justifyRight" title="Align right">≡</button>
        </div>
        <div id="modalReplyText" class="rich-editor" contenteditable="true" data-placeholder="Write a reply..."></div>
      </div>
      <button class="btn primary" id="modalReplySend" data-i18n="sendBtn">Send</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

function relativeTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(Number.isNaN(d.getTime())) return '';
  const mins = Math.max(0, Math.round((Date.now() - d.getTime())/60000));
  if(mins < 1) return 'now';
  if(mins < 60) return `${mins}m`;
  const hrs = Math.round(mins/60);
  if(hrs < 24) return `${hrs}h`;
  const days = Math.round(hrs/24);
  if(days < 7) return `${days}d`;
  return d.toLocaleDateString();
}
function formatDateTime(iso){
  if(!iso) return 'Date unavailable';
  const d = new Date(iso);
  if(Number.isNaN(d.getTime())) return 'Date unavailable';
  return d.toLocaleString();
}

async function callNotifFn(action, payload = {}) {
  const { data: sessionData } = await supabase.auth.getSession();
  const token = sessionData?.session?.access_token;
  if (!token) throw new Error('Not signed in');
  const url = `${supabase.supabaseUrl}/functions/v1/mhss-notifications`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...payload }),
  });
  let data; try { data = await res.json(); } catch { data = null; }
  if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status})`);
  return data;
}

async function uploadNotifFile(file) {
  const { data: sessionData } = await supabase.auth.getSession();
  const token = sessionData?.session?.access_token;
  if (!token) throw new Error('Not signed in');
  const url = `${supabase.supabaseUrl}/functions/v1/mhss-notifications`;
  const form = new FormData();
  form.append('action', 'upload_attachment');
  form.append('file', file);
  const res = await fetch(url, {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}` },
    body: form,
  });
  let data; try { data = await res.json(); } catch { data = null; }
  if (!res.ok) throw new Error((data && data.error) || `Upload failed (${res.status})`);
  return data?.attachment;
}

(function initHeaderDate(){
  const etMonths = ['መስከረም','ጥቅምት','ህዳር','ታህሳስ','ጥር','የካቲት','መጋቢት','ሚያዝያ','ግንቦት','ሰኔ','ሐምሌ','ነሐሴ','ጳጉሜ'];
  const JD_EPOCH_OFFSET = 1723856;
  function gToJdn(year, month, day){
    const y = month <= 2 ? year - 1 : year, m = month <= 2 ? month + 12 : month;
    const a = Math.floor(y / 100), b = 2 - a + Math.floor(a / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + b - 1524;
  }
  function toEthiopian(d){
    const jdn = gToJdn(d.getFullYear(), d.getMonth() + 1, d.getDate());
    const r = (jdn - JD_EPOCH_OFFSET) % 1461;
    const n = (r % 365) + 365 * Math.floor(r / 1460);
    const etYear = 4 * Math.floor((jdn - JD_EPOCH_OFFSET) / 1461) + Math.floor(r / 365) - Math.floor(r / 1460);
    return { etYear, etMonth: etMonths[Math.floor(n / 30)], etDay: (n % 30) + 1 };
  }
  const gc = new Date(), e = toEthiopian(gc), el = $('dateDisplay');
  if (el) el.textContent = gc.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + ` | ${e.etMonth} ${e.etDay}, ${e.etYear}`;
})();

let composeAttachments = [];

function formatBytes(bytes){
  if(!bytes) return '0 B';
  const units=['B','KB','MB','GB']; let i=0, n=bytes;
  while(n>=1024 && i<units.length-1){n/=1024;i++;}
  return `${n.toFixed(i?1:0)} ${units[i]}`;
}
function fileIcon(type,name){
  if((type||'').startsWith('image/')) return '🖼️';
  if((type||'').includes('pdf') || /\.pdf$/i.test(name)) return '📕';
  if(/\.(doc|docx)$/i.test(name)) return '📘';
  if(/\.(xls|xlsx)$/i.test(name)) return '📗';
  if(/\.(ppt|pptx)$/i.test(name)) return '📙';
  return '📄';
}
function renderComposeFiles(){
  const el=$('composeFiles');
  if(!composeAttachments.length){el.classList.add('hidden');el.innerHTML='';return;}
  el.classList.remove('hidden');

      <span style="font-size:10px;color:var(--muted)">${formatBytes(f.size)}</span>

    </div>`).join('');
  el.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{

function sanitizeRichHtml(html){
  const template=document.createElement('template'); template.innerHTML=html;
  template.content.querySelectorAll('script,style,iframe,object,embed,form,meta,link').forEach(n=>n.remove());
  template.content.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(a=>{
      if(/^on/i.test(a.name)) el.removeAttribute(a.name);
      if((a.name==='href'||a.name==='src') && /^(javascript|data):/i.test(a.value)) el.removeAttribute(a.name);
    });
  });
  return template.innerHTML.trim();
}
function plainFromRich(html){
  const d=document.createElement('div'); d.innerHTML=html;
  return (d.innerText||'').trim();
}
function renderMessageContent(html){
  return sanitizeRichHtml(html || '').replace(/<img\b([^>]*?)>/gi,(m,attrs)=>{
    const src=(attrs.match(/\bsrc=["']([^"']+)["']/i)||[])[1];
    if(!src || /^(javascript|data):/i.test(src)) return '';
    return `<img ${attrs}>`;
  });
}
function renderAttachments(attachments=[]){
  return attachments.map(a=>{
    const url=a.url || a.public_url || a.file_url || a.path || '';
    const name=a.file_name || a.name || 'Attachment';
    const type=a.mime_type || a.file_type || '';
    const size=a.file_size ? formatBytes(Number(a.file_size)) : '';
    if(type.startsWith('image/') && url){
      return `<img src="${esc(url)}" alt="${esc(name)}" data-image-preview="${esc(url)}" loading="lazy">`;
    }
    return `<div class="attach-card">
      <div class="attach-icon">${fileIcon(type,name)}</div>
      <div class="attach-info"><div class="attach-name">${esc(name)}</div><div class="attach-meta">${esc(type||'File')} ${size?'· '+esc(size):''}</div></div>
      <div class="attach-actions">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">Open</a><a href="${esc(url)}" download>Download</a>`:''}</div>
    </div>`;
  }).join('');
}
function renderRichMessage(mine,m,thread){
  const senderProfile = m.sender || getProfile(m.sender_id,thread) || {};
  const recipientProfile = thread.recipient || {};
  const sender = senderProfile.name || senderProfile.email || senderLabel(m,thread);
  const attachments = m.attachments || m.message_attachments || [];
  const images = attachments.filter(a=>((a.mime_type||a.file_type||a.type||'').startsWith('image/')) && (a.url||a.public_url||a.file_url||a.path));
  const files = attachments.filter(a=>!images.includes(a));
  const rawContent = m.body ?? m.content ?? '';
  const content = m.content_format === 'html'
    ? renderMessageContent(rawContent)
    : esc(String(rawContent)).replace(/\n/g,'<br>');
  const topImages=images.filter(a=>(a.position||'top')!=='bottom');
  const bottomImages=images.filter(a=>a.position==='bottom');
  const imageStack = (arr, cls='') => arr.length ? `<div class="media-stack ${cls}">${arr.map(a=>{const url=a.url||a.public_url||a.file_url||a.path;const name=a.file_name||a.name||'Image';return `<img class="message-image" src="${esc(url)}" alt="${esc(name)}" data-image-preview="${esc(url)}" loading="lazy">`;}).join('')}</div>` : '';
  const wrap=document.createElement('div'); wrap.className=`bubble ${mine?'bubble-self':'bubble-other'}`;
  wrap.innerHTML=`<div class="message-card">
    <div class="msg-head">${avatarHtml(senderProfile,sender,'msg-avatar')}<div style="min-width:0"><div class="msg-name">${esc(sender)}</div><div class="msg-role">${mine?'Sender':'Receiver'} · <span class="msg-time">${formatDateTime(m.created_at)}</span></div></div></div>
    ${imageStack(topImages)}
    ${content?`<div class="media-caption">${content}</div>`:(files.length||images.length?'':'<div class="media-caption"><span style="color:var(--muted)">No message content</span></div>')}
    ${imageStack(bottomImages,'bottom')}
    ${files.length?`<div class="document-list">${renderAttachments(files)}</div>`:''}
  </div>`;
  wrap.querySelectorAll('[data-image-preview]').forEach(img=>img.addEventListener('click',()=>{ $('imagePreviewImg').src=img.dataset.imagePreview; $('imagePreviewOverlay').classList.remove('hidden'); }));
  return wrap;
}

/* Rich message detail popup */
renderThreadModal = function(thread){
  $('modalSubject').innerHTML = `<div class="detail-subject">${esc(threadDisplaySubject(thread))}</div><div class="detail-meta">${esc(thread.is_broadcast ? 'Broadcast' : ((thread.sender?.name || thread.sender?.email || 'Sender') + ' → ' + (thread.recipient?.name || thread.recipient?.email || 'Receiver')))}</div>`;
  const body = $('modalThreadBody'); body.innerHTML='';
  if (thread.receipt_summary) {
    const r=thread.receipt_summary;
    const bar=document.createElement('div'); bar.className='receipt-bar';
    bar.innerHTML=`<strong>Delivery & Read</strong> · ${esc(String(r.delivered??0))} delivered · ${esc(String(r.read??0))} read · ${esc(String(r.unread??0))} unread`;
    if(Array.isArray(r.users)&&r.users.length){const list=document.createElement('div');list.className='receipt-list';list.innerHTML=r.users.map(u=>`<span class="receipt-pill">${esc(u.name||u.email||'User')} · ${u.read?'✓✓ Read':'○ Unread'}</span>`).join('');bar.appendChild(list);}
    body.appendChild(bar);
  }
  (thread.messages||[]).forEach(m=>body.appendChild(renderRichMessage(m,m.sender_id===callerId,thread)));
  requestAnimationFrame(()=>{body.scrollTop=body.scrollHeight;});
  if(thread.unread){callNotifFn('mark_read',{thread_id:thread.id}).then(()=>{thread.unread=false;renderThreadList();}).catch(()=>{});}
};

/* Send rich HTML while retaining compatibility with the current Edge Function. */
const __oldComposeSubmit = $('composeForm').onsubmit;
$('composeForm').removeEventListener('submit', __oldComposeSubmit);
$('composeForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const notice=$('composeNotice'); hideNotice(notice);
  const recipientId=$('fRecipient').value||null;
  const subject=$('fSubject').value.trim();
  const rich=sanitizeRichHtml($('fBody').innerHTML);
  const body=plainFromRich(rich);
  if(!body && !composeAttachments.length) return;
  $('sendBtn').disabled=true;
  try{
    /* Send rich content. If backend accepts content/html, it is used;
       otherwise body remains backward-compatible. */
    const uploadedAttachments = [];
    for (const file of composeAttachments) {
      const uploaded = await uploadNotifFile(file);
      if (uploaded) uploadedAttachments.push({...uploaded, position: $('attachmentPosition')?.value === 'bottom' ? 'bottom' : 'top'});
    }
    await callNotifFn('send_notification',{
      recipient_id:recipientId,subject,body:rich,content:rich,content_format:'html',
      attachments: uploadedAttachments
    });
    $('fSubject').value=''; $('fBody').innerHTML=''; composeAttachments=[];
    renderComposeFiles();
    toast(t('sendSuccess'));
    await loadThreads();
  }catch(err){
    notice.textContent=err.message||t('sendFail');notice.classList.remove('hidden');
  }finally{$('sendBtn').disabled=false;}
});

$('draftBtn')?.addEventListener('click',()=>{
  const draft={recipient:$('fRecipient').value,subject:$('fSubject').value,body:sanitizeRichHtml($('fBody').innerHTML),saved_at:new Date().toISOString()};
  localStorage.setItem('mh_message_draft',JSON.stringify(draft));
  toast('Draft saved');
});
$('previewBtn')?.addEventListener('click',()=>{
  const rich=sanitizeRichHtml($('fBody').innerHTML);
  const win=document.createElement('div');
  win.className='overlay'; win.innerHTML=`<div class="modal">
    <div class="modal-head"><h3>${esc($('fSubject').value||'Message Preview')}</h3><button class="btn">✕</button></div>
    <div class="modal-thread"><div class="message-card" style="max-width:100%"><div class="msg-head"><div class="msg-avatar">O</div><div><div class="msg-name">Owner / Sender</div><div class="msg-role">Preview</div></div></div><div class="msg-content">${rich||'<span style="color:var(--muted)">Empty message</span>'}</div></div></div>
  </div>`;
  document.body.appendChild(win);
  win.querySelector('.modal-head .btn').onclick=()=>win.remove();
  win.addEventListener('click',e=>{if(e.target===win)win.remove();});
});

const oldSendModalReply=sendModalReply;
sendModalReply = async function(){
  const text=plainFromRich(sanitizeRichHtml($('modalReplyText').innerHTML));
  const rich=sanitizeRichHtml($('modalReplyText').innerHTML);
  if(!text || !activeThreadId)return;
  $('modalReplySend').disabled=true;
  try{
    await callNotifFn('reply',{thread_id:activeThreadId,body:rich,content:rich,content_format:'html'});
    $('modalReplyText').innerHTML='';
    toast(t('replySuccess')); await loadThreads();
    const thread=threads.find(t=>t.id===activeThreadId); if(thread)renderThreadModal(thread);
  }catch(err){toast(err.message||t('sendFail'))}
  finally{$('modalReplySend').disabled=false}
};
$('modalReplySend').onclick=sendModalReply;

const savedDraft=localStorage.getItem('mh_message_draft');
if(savedDraft){
  try{
    const d=JSON.parse(savedDraft);
    $('fRecipient').value=d.recipient||'';
    $('fSubject').value=d.subject||'';
    $('fBody').innerHTML=d.body||'';
  }catch{}
}


/* ===================== Boot ===================== */
(async()=>{
  const r = await initializeRBAC({ supabase });
  if (!r?.allowed) { location.href = 'dashboard.html'; return; }
  const { data: userData } = await supabase.auth.getUser();
  callerId = userData?.user?.id || null;
  const adminMode = isSuperAdmin();
  isAdminUser = !!adminMode;
  $('app').classList.remove('hidden');
  applyLanguage(currentLang);
  if (!adminMode) {
    document.querySelector('.grid2 > section:first-child')?.classList.add('hidden');
    document.querySelector('.hero p')?.setAttribute('data-i18n','receiverDesc');
  } else {
    await loadProfiles();
  }
  await loadThreads();
  if (window.__mhThreadRefreshTimer) clearInterval(window.__mhThreadRefreshTimer);
  window.__mhThreadRefreshTimer = setInterval(loadThreads, 60 * 1000);
})();
